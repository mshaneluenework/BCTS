name: Meraki Health Report

on:
  schedule:
    - cron: "0 * * * *"   # every hour - adjust to taste (e.g. "0 */6 * * *" for every 6h)
  workflow_dispatch: {}    # lets you also trigger it manually from the Actions tab

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install meraki

      - name: Generate report
        env:
          MERAKI_DASHBOARD_API_KEY: ${{ secrets.MERAKI_DASHBOARD_API_KEY }}
        run: python "Automatic Weekly Network Health Report/Meraki_7_Day_Newtork_Health_Report.py" --org-id 361642

      - name: Commit refreshed report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meraki_health_report_latest.html latest.json
          git diff --quiet --cached || git commit -m "Auto-refresh network health report"
          git push
